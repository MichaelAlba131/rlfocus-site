# A cada push na main: build do site e publicação do resultado no branch "deploy".
# O cPanel da HostGator (Git Version Control) puxa o branch "deploy" e copia para o public_html (.cpanel.yml).
name: Build e publicar no branch deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp .cpanel.yml dist/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
          enable_jekyll: true
          commit_message: "build: ${{ github.sha }}"
